# Render Blueprint: Dashboard -> New -> Blueprint -> this repo.
# Free plan: one web service (API + frontend on one origin). Postgres lives on
# Neon, Redis is an existing Key Value (a workspace gets one free instance).
services:
  - type: web
    name: jarvis
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    # No database query: uptime pings must not keep Neon awake.
    healthCheckPath: /api/health/live
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Neon -> Connect -> connection string (keep ?sslmode=require).
      - key: DATABASE_URL
        sync: false
      # Internal URL of a Key Value in the same region (Connect -> Internal).
      # It may be shared: BullMQ keys live under the jarvis: prefix. Its
      # maxmemory policy must be noeviction, or queued briefings can vanish.
      - key: REDIS_URL
        sync: false
      # FRONTEND_URL and GOOGLE_CALLBACK_URL default to RENDER_EXTERNAL_URL.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # openssl rand -base64 32. Keep it: changing it locks stored tokens.
      - key: TOKEN_ENC_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional: leave empty to hide Trello.
      - key: TRELLO_API_KEY
        sync: false
      # Shown in the privacy policy (build-time; redeploy after changing).
      - key: VITE_OPERATOR_NAME
        sync: false
      - key: VITE_PRIVACY_EMAIL
        sync: false
